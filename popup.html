<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UG to ChordPro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 440px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      padding: 16px;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #f59e0b;
      color: #000;
      font-weight: 900;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .song-info {
      font-size: 11px;
      color: #a1a1aa;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      background: #18181b;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #27272a;
    }
    .transpose-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.btn-step {
      background: #27272a;
      color: #fff;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
    }
    .trans-val {
      font-family: monospace;
      font-weight: bold;
      color: #f59e0b;
      min-width: 20px;
      text-align: center;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .btn-action {
      background: #27272a;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-action:hover { background: #3f3f46; }
    .btn-primary {
      background: #f59e0b;
      color: #000;
      font-weight: 700;
    }
    .btn-primary:hover { background: #fbbf24; }
    textarea {
      width: 100%;
      height: 260px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      color: #fef08a;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }
    .not-ug {
      text-align: center;
      padding: 24px 12px;
      color: #71717a;
    }
    .not-ug a { color: #f59e0b; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="icon48.png" alt="Icon" style="width: 26px; height: 26px; object-fit: contain;">
      <div>
        <h1>ChordPro Converter</h1>
        <div class="song-info" id="songInfo">Detecting tab...</div>
      </div>
    </div>
  </header>

  <div id="converterView" style="display: none;">
    <div class="controls">
      <div class="transpose-box">
        <span style="color: #71717a; font-size: 11px;">Transpose:</span>
        <button class="btn-step" id="transDown">-1</button>
        <span class="trans-val" id="transVal">0</span>
        <button class="btn-step" id="transUp">+1</button>
      </div>

      <div class="actions">
        <button class="btn-action" id="btnCopy">📋 Copy</button>
        <button class="btn-action" id="btnPdf" style="background: #059669; color: #fff;">📄 PDF</button>
        <button class="btn-action btn-primary" id="btnDownload">💾 .cho</button>
      </div>
    </div>

    <textarea id="output" readonly></textarea>
  </div>

  <div id="fallbackView" class="not-ug">
    <p style="font-weight: 600; color: #a1a1aa; margin-bottom: 6px;">No Ultimate Guitar tab found on this tab.</p>
    <p style="font-size: 11px; margin-bottom: 12px;">Navigate to any song on Ultimate Guitar, for example:</p>
    <a href="https://tabs.ultimate-guitar.com/tab/leonard-cohen/hallelujah-chords-83861" target="_blank">Open Hallelujah on Ultimate Guitar ↗</a>
  </div>

  <script src="converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
